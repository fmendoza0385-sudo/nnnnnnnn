name: LUKKA Television - Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Cancela compilaciones anteriores de la misma rama si llega un push nuevo
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # necesario solo para publicar el Release al subir una etiqueta v*

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # Valida que gradle-wrapper.jar sea el oficial de Gradle
      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Cache de dependencias y del wrapper (acelera compilaciones siguientes)
      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK debug
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee build.log
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      # Si falla: muestra el error al inicio de la página de la ejecución (Summary) y sube el log completo
      - name: Resumen del error
        if: failure()
        run: |
          {
            echo '## Error de compilación'
            echo '```'
            grep -n -E -B2 -A14 'FAILURE:|error:|What went wrong|Could not (resolve|find|get)|requires' build.log | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir log de compilación
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/**
          if-no-files-found: ignore

      # ---- APK release firmada (opcional: solo si configuras los 4 secrets) ----
      - name: Preparar keystore
        id: ks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lukka.jks"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Sin KEYSTORE_BASE64: se omite la APK release firmada."
          fi

      - name: Compilar APK release firmada
        if: steps.ks.outputs.available == 'true'
        run: ./gradlew --no-daemon --stacktrace assembleRelease
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/lukka.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: LUKKA-Television-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Subir APK release
        if: steps.ks.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LUKKA-Television-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # Al subir una etiqueta (ej. v0.2.0) se publica un Release con la APK
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
